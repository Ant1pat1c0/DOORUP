<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOORUP</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #121212; color: #fff;
      font-family: 'Segoe UI', sans-serif;
    }
    #loader {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1; background: #121212; transition: opacity 0.3s ease;
    }
    .spinner {
      width: 38px; height: 38px; border: 3px solid #282828; border-top-color: #1db954;
      border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #888; font-size: 0.9rem; margin: 0; }
    iframe {
      width: 100%; height: 100%; border: none;
      position: absolute; top: 0; left: 0; z-index: 2;
    }
  </style>
</head>
<body>

  <!-- Pantalla de carga estética mientras carga Apps Script -->
  <div id="loader">
    <div class="spinner"></div>
    <p>Abriendo DOORUP PRO...</p>
  </div>

  <!-- El contenedor de la app.
       allow= delega Permissions Policy al iframe de Apps Script (y de ahí al
       iframe interno de googleusercontent.com). Sin clipboard-write / web-share
       acá, "Copiar link" y el share nativo NO funcionan en producción (2
       iframes de profundidad); en el /dev de Apps Script sí, porque ahí es
       top-level y hay un hop menos. -->
  <iframe id="app-frame" allow="autoplay; clipboard-write; web-share"></iframe>

  <script>
    // URL base del web-app de Apps Script (deployment que usa la familia/APK).
    var URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxhhNvdm9NHRTq1Wxq3OT61jmeEmyWIcaiMAnhM3t6tgzi2YknueZlW6JbttNFYr05a/exec";

    // Parámetros que vienen en la URL (?playlist=xyz, ?sala=K3F9, ...).
    var queryParams = window.location.search; // "" | "?playlist=abc"

    var iframe = document.getElementById("app-frame");
    var lanzado = false;

    // ── ROMPE-CACHÉ ────────────────────────────────────────────────────────
    // El WebView de la TV cachea el documento de Apps Script de forma agresiva
    // (WebViews viejos ignoran el header no-store). Como cachean POR URL, le
    // agregamos ?v=<version> a la URL del iframe: cada deploy cambia el valor
    // -> cache-miss forzado -> codigo fresco. El numero sale de version.txt,
    // que leemos SIEMPRE fresco (URL unica por timestamp + cache:no-store).
    //
    // Importante: ?v= va en la URL de script.google.com (el iframe EXTERNO).
    // NO toca el origen del iframe INTERNO (*.googleusercontent.com), que es
    // donde vive el localStorage de la sesion (PIN, favoritos, persona). Por
    // eso romper cache aca NO borra la sesion. Ver CACHE_BUSTING.md.
    function armarSrc(version) {
      if (!version) return URL_APPS_SCRIPT + (queryParams || "");
      var extra = queryParams ? "&" + queryParams.slice(1) : "";
      return URL_APPS_SCRIPT + "?v=" + encodeURIComponent(version) + extra;
    }

    function lanzar(version) {
      if (lanzado) return;
      lanzado = true;
      iframe.src = armarSrc(version);
    }

    // Pide version.txt con reintentos: un boot en frío de TV puede tardar
    // varios segundos en tener Wi-Fi/DNS listos, y un solo intento fallido
    // ahí tiraba directo al fallback sin ?v= (justo el bug que este archivo
    // existe para evitar — ver CACHE_BUSTING.md).
    function pedirVersion(intentosRestantes) {
      return fetch("version.txt?_=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.text() : Promise.reject(new Error("http " + r.status)); })
        .then(function (t) { return (t || "").trim().split(/\s+/)[0]; })
        .catch(function (err) {
          if (intentosRestantes > 0) return pedirVersion(intentosRestantes - 1);
          throw err;
        });
    }

    pedirVersion(2) // 1 intento + hasta 2 reintentos
      .then(function (v) { lanzar(v); })
      .catch(function () { lanzar(""); }); // sin red tras los reintentos -> carga sin ?v= (lo que haya en cache)

    // Red de seguridad final: no dejamos el spinner colgado para siempre si
    // de verdad no hay conexión. Más margen que antes (era 4s) para darle
    // tiempo a los reintentos en un boot en frío.
    setTimeout(function () { lanzar(""); }, 8000);

    iframe.onload = function () {
      var loader = document.getElementById("loader");
      if (loader) {
        loader.style.opacity = "0";
        setTimeout(function () { loader.style.display = "none"; }, 300);
      }
    };
  </script>

  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(function () { console.log('Service Worker registrado'); })
      .catch(function (err) { console.error('Error al registrar SW:', err); });
  }
</script>

</body>
</html>
